name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format clang-tidy wget bear

      - name: Fetch doctest header (via Makefile)
        run: |
          make fetch-doctest

      - name: Fetch Json Lib
        run: |
          make fetch-json

      - name: Build (make)
        run: |
          make

      - name: Run tests
        run: |
          make test

      - name: Check clang-format
        run: |
          make format
          if ! git diff --exit-code; then
            echo "WARNING: Code is not formatted according to clang-format"
            echo "This is informational only - CI will continue"
            echo "To format locally: make format"
          else
            echo "Code formatting is correct"
          fi

      - name: Run clang-tidy
        run: |
          make clang-tidy


